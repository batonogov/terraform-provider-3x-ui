# golangci-lint configuration v2

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gocritic
    - errname
    - errorlint
    - gosec

  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - unnamedResult
        - ifElseChain
        - hugeParam
        - paramTypeCombine
        - builtinShadow
        - singleCaseSwitch
        - rangeValCopy
        - unlambda

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic

      # G304 is safe in tests: paths are derived from runtime.Caller or
      # test-controlled environment variables, not user input.
      # G101 fixtures use realistic-looking but inert test data.
      # G124 cookies are test-server-only, never exposed to real browsers.
      - path: _test\.go
        linters:
          - gosec

      - path: vendor/
        linters:
          - all

formatters:
  settings:
    goimports:
      local-prefixes:
        - github.com/batonogov/terraform-provider-threexui
