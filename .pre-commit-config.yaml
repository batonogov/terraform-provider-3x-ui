# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Go checks via Taskfile (same as CI)
  - repo: local
    hooks:
      - id: task-fmt
        name: task fmt
        entry: task fmt
        language: system
        pass_filenames: false
        types: [go]

      - id: task-vet
        name: task vet
        entry: task vet
        language: system
        pass_filenames: false
        types: [go]

      - id: task-lint
        name: task lint
        entry: task lint
        language: system
        pass_filenames: false
        types: [go]

      - id: task-build
        name: task build
        entry: task build
        language: system
        pass_filenames: false
        types: [go]

      - id: task-test
        name: task test
        entry: task test
        language: system
        pass_filenames: false
        types: [go]

  # Common hooks for any files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
