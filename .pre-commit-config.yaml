# Pre-commit hooks configuration
# Установка: pip install pre-commit && pre-commit install
# Запуск вручную: pre-commit run --all-files

repos:
  # Go-specific hooks
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      # gofmt - форматирование кода
      - id: go-fmt
        args: [-w]

      # go vet - статический анализ
      - id: go-vet-mod

      # go build - проверка компиляции
      - id: go-build-mod

  # golangci-lint via task lint
  - repo: local
    hooks:
      - id: task-lint
        name: task lint (golangci-lint)
        entry: task lint
        language: system
        pass_filenames: false
        types: [go]

  # Acceptance tests via task test
  - repo: local
    hooks:
      - id: task-test
        name: task test (acceptance tests)
        entry: task test
        language: system
        pass_filenames: false
        always_run: true

  # Общие хуки для любых файлов
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Trailing whitespace
      - id: trailing-whitespace

      # Конец файла - пустая строка
      - id: end-of-file-fixer

      # Проверка YAML
      - id: check-yaml
        args: [--unsafe]  # для docker-compose.yaml с якорями

      # Проверка JSON
      - id: check-json

      # Большие файлы (>500KB)
      - id: check-added-large-files
        args: [--maxkb=500]

      # Merge conflict markers
      - id: check-merge-conflict

      # Проверка case conflicts (для кросс-платформы)
      - id: check-case-conflict
