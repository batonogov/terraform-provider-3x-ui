# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Go checks via Taskfile (same as CI)
  - repo: local
    hooks:
      - id: task-fmt
        name: task fmt
        entry: task fmt
        language: system
        pass_filenames: false
        types: [go]

      - id: task-vet
        name: task vet
        entry: task vet
        language: system
        pass_filenames: false
        types: [go]

      - id: task-lint
        name: task lint
        entry: task lint
        language: system
        pass_filenames: false
        types: [go]

      - id: task-build
        name: task build
        entry: task build
        language: system
        pass_filenames: false
        types: [go]

      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        pass_filenames: false
        types: [markdown]

  # Common hooks for any files.
  # rev pinned to a commit SHA (not a tag) — same rationale as the pinned
  # GitHub Actions in .github/workflows/: tags are mutable. Update via
  # `pre-commit autoupdate --freeze` which produces this exact `<sha>
  # frozen: <tag>` format. Bare `pre-commit autoupdate` will un-pin.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: c4a0b883114b00d8d76b479c820ce7950211c99b  # frozen: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
