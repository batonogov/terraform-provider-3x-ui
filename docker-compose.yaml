services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v2.8.9
    container_name: 3xui_app
    ports:
      - "2053:2053" # HTTP panel
      - "54321:54321" # XRAY API port
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    restart: unless-stopped
