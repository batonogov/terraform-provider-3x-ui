version: "3"

vars:
  GOFILES:
    sh: git ls-files '*.go'

tasks:
  default:
    desc: Format, lint и тесты
    cmds:
      - task: fmt
      - task: lint
      - task: test

  fmt:
    desc: Форматирование Go-файлов (gofmt)
    cmds:
      - |
        if [ -n "{{.GOFILES}}" ]; then
          gofmt -w {{.GOFILES | shellQuote}}
        else
          echo "Нет Go-файлов для форматирования"
        fi

  lint:
    desc: Запуск golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Юнит-тесты
    cmds:
      - go test ./...

  build:
    desc: Сборка плагина
    cmds:
      - go build ./...

  acc:
    desc: Acceptance-тесты (поднимает локальный 3x-ui, нужны переменные THREEXUI_*)
    cmds:
      - task env-up
      - |
        TF_ACC=1 go test ./internal/provider/acceptance -v || { task env-down; exit 1; }
      - task env-down

  smoke:
    desc: Smoke-тест примеров (нужен terraform и переменные THREEXUI_*)
    cmds:
      - ./scripts/smoke.sh

  env-up:
    desc: Поднять локальный 3x-ui через docker-compose
    cmds:
      - docker compose up -d

  env-down:
    desc: Остановить локальный 3x-ui и удалить тома
    cmds:
      - docker compose down -v
