version: "3"

tasks:
  build:
    desc: Собрать локальный dev-бинарь провайдера
    cmds:
      - go build -o terraform-provider-threexui

  test:
    desc: Запустить unit + acceptance тесты (нужен локальный 3x-ui)
    cmds:
      - task: test:unit
      - task: test:acc

  test:unit:
    desc: Запустить unit-тесты (без Docker / Terraform)
    cmds:
      - go test ./provider -skip '^TestAcc' -count=1 -v

  test:unit:coverage:
    desc: Запустить unit-тесты с покрытием (coverage.out, atomic mode)
    cmds:
      - go test ./provider -skip '^TestAcc' -count=1 -coverprofile=coverage.out -covermode=atomic -v

  test:acc:
    desc: Запустить acceptance-тесты (нужен локальный 3x-ui)
    vars:
      TERRAFORM_PATH:
        sh: which terraform
      THREEXUI_VERSION: '{{.THREEXUI_VERSION | default "v3.1.0"}}'
    cmds:
      - docker compose down -v 2>/dev/null || true
      - docker compose up --detach --wait --quiet-pull
      - defer: docker compose down
      - task: _wait-for-xray
      - task: _warm-xray-version-cache
      - >-
        TF_ACC=1
        TF_ACC_TERRAFORM_PATH={{.TERRAFORM_PATH}}
        TF_ACC_PROVIDER_NAMESPACE=batonogov
        TF_ACC_PROVIDER_HOST=registry.terraform.io
        THREEXUI_ENDPOINT=http://localhost:2053
        THREEXUI_USERNAME=admin
        THREEXUI_PASSWORD=admin
        THREEXUI_VERSION={{.THREEXUI_VERSION}}
        go test ./provider -run TestAcc -count=1 -timeout 600s -v

  test:acc:compat:
    desc: Запустить acceptance-тесты совместимости (версионный пропуск)
    vars:
      TERRAFORM_PATH:
        sh: which terraform
      THREEXUI_VERSION: '{{.THREEXUI_VERSION | default "v3.1.0"}}'
    cmds:
      - echo "Running tests against 3x-ui {{.THREEXUI_VERSION}} at http://localhost:2053"
      - docker compose down -v 2>/dev/null || true
      - docker compose up --detach --wait --quiet-pull
      - defer: docker compose down
      - task: _wait-for-xray
      - task: _warm-xray-version-cache
      - >-
        TF_ACC=1
        TF_ACC_TERRAFORM_PATH={{.TERRAFORM_PATH}}
        TF_ACC_PROVIDER_NAMESPACE=batonogov
        TF_ACC_PROVIDER_HOST=registry.terraform.io
        THREEXUI_ENDPOINT=http://localhost:2053
        THREEXUI_USERNAME=admin
        THREEXUI_PASSWORD=admin
        THREEXUI_VERSION={{.THREEXUI_VERSION}}
        go test ./provider -run TestAcc -count=1 -timeout 600s -v

  _wait-for-xray:
    desc: Дождаться готовности xray-подсистемы внутри 3x-ui (внутренняя задача)
    silent: true
    cmds:
      # docker compose --wait + healthcheck подтверждают, что роутер 3x-ui
      # отвечает. Но xray-подсистема инициализируется на 1–3 с позже, и до
      # этого момента GetCurrentXrayVersion возвращает "Unknown", что роняет
      # тесты вроде XrayVersionDrift ложным ErrXrayVersionUnknown (issue #161).
      #
      # Пробуем /panel/api/server/status и проверяем xray.state == "running"
      # (или version != "Unknown"). Этот эндпоинт не ходит во внешние сервисы,
      # в отличие от getXrayVersion (тот дёргает GitHub API за списком релизов
      # и упирается в анонимный rate limit на шаренном runner IP — issue #161).
      - |
        cookie=$(mktemp)
        trap 'rm -f "$cookie"' EXIT
        for i in $(seq 1 30); do
          csrf_body=$(curl -fsS -c "$cookie" -b "$cookie" \
            "http://localhost:2053/csrf-token" 2>/dev/null || true)
          csrf=$(printf '%s' "$csrf_body" | sed -n 's/.*"obj":"\([^"]*\)".*/\1/p')
          if [ -n "$csrf" ]; then
            curl -fsS -c "$cookie" -b "$cookie" -H "X-CSRF-Token: $csrf" \
              -d "username=admin&password=admin&_csrf=$csrf" \
              "http://localhost:2053/login" >/dev/null 2>&1 || { sleep 1; continue; }
          else
            curl -fsS -c "$cookie" -b "$cookie" -d 'username=admin&password=admin' \
              "http://localhost:2053/login" >/dev/null 2>&1 || { sleep 1; continue; }
          fi
          body=$(curl -fsS -b "$cookie" \
            "http://localhost:2053/panel/api/server/status" 2>/dev/null || true)
          # Успех: success:true и `"xray":{...,"state":"running",...}`.
          # Якорим state по xray-блоку, а не голым `"state":"running"` —
          # иначе будущие поля state в других секциях ответа дадут ложно
          # успешное срабатывание.
          if printf '%s' "$body" | grep -q '"success":true' \
             && printf '%s' "$body" | grep -Eq '"xray":\{[^}]*"state":"running"'; then
            echo "xray subsystem ready after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "xray subsystem did not become ready within 30s — last response: $body" >&2
        exit 1

  _warm-xray-version-cache:
    desc: Pre-warm 3x-ui's internal GitHub API cache to avoid rate limiting during tests
    silent: true
    cmds:
      # 3x-ui caches the GitHub API response for 15 minutes. On cold start
      # the first getXrayVersion call fetches from GitHub. Pre-warming the
      # cache eliminates rate-limit failures during the actual test run.
      # Non-fatal: logs a warning on failure, does not block tests.
      - |
        cookie=$(mktemp)
        trap 'rm -f "$cookie"' EXIT
        csrf_body=$(curl -fsS -c "$cookie" -b "$cookie" \
          "http://localhost:2053/csrf-token" 2>/dev/null || true)
        csrf=$(printf '%s' "$csrf_body" | sed -n 's/.*"obj":"\([^"]*\)".*/\1/p')
        if [ -n "$csrf" ]; then
          curl -fsS -c "$cookie" -b "$cookie" -H "X-CSRF-Token: $csrf" \
            -d "username=admin&password=admin&_csrf=$csrf" \
            "http://localhost:2053/login" >/dev/null 2>&1
        else
          curl -fsS -c "$cookie" -b "$cookie" \
            -d 'username=admin&password=admin' \
            "http://localhost:2053/login" >/dev/null 2>&1
        fi
        for i in 1 2 3 4 5; do
          body=$(curl -fsS -b "$cookie" \
            "http://localhost:2053/panel/api/server/getXrayVersion" 2>/dev/null || true)
          if printf '%s' "$body" | grep -q '"success":true'; then
            count=$(printf '%s' "$body" | grep -o '"v[0-9]' | wc -l | tr -d ' ')
            echo "xray version cache warmed (${count} versions fetched)"
            exit 0
          fi
          sleep $((2 ** (i - 1)))
        done
        echo "warning: could not warm xray version cache (rate limited?) — tests will proceed"

  fmt:
    desc: Форматировать Go-файлы
    cmds:
      - gofmt -w provider/*.go

  vet:
    desc: Запустить go vet
    cmds:
      - go vet ./...

  lint:
    desc: Запустить golangci-lint
    cmds:
      - golangci-lint run

  pre-commit:
    desc: Запустить все pre-commit проверки вручную
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: build
