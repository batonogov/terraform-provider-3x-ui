version: "3"

tasks:
  build:
    desc: Собрать локальный dev-бинарь провайдера
    cmds:
      - go build -o terraform-provider-threexui

  test:
    desc: Запустить все тесты + acceptance (нужен локальный 3x-ui)
    vars:
      TOFU_PATH:
        sh: which tofu
    cmds:
      - docker compose down -v 2>/dev/null || true
      - docker compose up --detach --wait
      - defer: docker compose down
      - >-
        TF_ACC=1
        TF_ACC_TERRAFORM_PATH={{.TOFU_PATH}}
        TF_ACC_PROVIDER_NAMESPACE=batonogov
        TF_ACC_PROVIDER_HOST=registry.opentofu.org
        THREEXUI_ENDPOINT=http://localhost:2053
        THREEXUI_USERNAME=admin
        THREEXUI_PASSWORD=admin
        go test ./provider -run TestAcc -count=1 -timeout 600s -v

  fmt:
    desc: Форматировать Go-файлы
    cmds:
      - gofmt -w provider/*.go

  vet:
    desc: Запустить go vet
    cmds:
      - go vet ./...

  lint:
    desc: Запустить golangci-lint
    cmds:
      - golangci-lint run

  pre-commit:
    desc: Запустить все pre-commit проверки вручную
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: build
