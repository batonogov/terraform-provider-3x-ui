version: "3"

tasks:
  build:
    desc: Собрать локальный dev-бинарь провайдера
    cmds:
      - go build -o terraform-provider-threexui

  test:
    desc: Запустить все тесты + acceptance (нужен локальный 3x-ui)
    cmds:
      - docker compose up -d
      - go test ./...
      - TF_ACC=1 THREEXUI_ENDPOINT=http://localhost:2053 THREEXUI_USERNAME=admin THREEXUI_PASSWORD=admin go test ./provider -run TestAcc -count=1
      - docker compose down

  fmt:
    desc: Форматировать Go-файлы
    cmds:
      - gofmt -w provider/*.go
