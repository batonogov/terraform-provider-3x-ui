name: Bug Report
description: Report a bug in terraform-provider-3x-ui
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the fields below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal Terraform config and steps to trigger the issue.
      placeholder: |
        1. Create the following resource:
        ```hcl
        resource "threexui_inbound" "example" { ... }
        ```
        2. Run `terraform apply`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or `terraform plan` output if applicable.
    validations:
      required: true

  - type: input
    id: provider_version
    attributes:
      label: Provider Version
      placeholder: "e.g. 2.0.0"
    validations:
      required: true

  - type: input
    id: threexui_version
    attributes:
      label: 3x-ui Version
      placeholder: "e.g. v2.9.0"
    validations:
      required: true

  - type: input
    id: terraform_version
    attributes:
      label: Terraform Version
      placeholder: "e.g. 1.9.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Ubuntu 24.04, macOS 15"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information (logs, screenshots, related issues).
    validations:
      required: false
