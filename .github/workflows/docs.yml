name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "README*.md"
      - "CONTRIBUTING.md"
      - ".github/**"
      - ".pre-commit-config.yaml"
      - "scripts/check-readme-parity.sh"
      - "scripts/sync-versions.sh"
      - "provider/**/*.go"
      - go.mod
      - go.sum
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "examples/**"
      - "README*.md"
      - "CONTRIBUTING.md"
      - ".github/**"
      - ".pre-commit-config.yaml"
      - "scripts/check-readme-parity.sh"
      - "scripts/sync-versions.sh"
      - "provider/**/*.go"
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check examples formatting
        run: terraform fmt -check -recursive examples/

      - name: Validate examples against the current provider schema
        run: scripts/validate-examples.sh

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            docs/**/*.md
            README*.md
            CONTRIBUTING.md

      - name: Check localized README table parity
        run: scripts/check-readme-parity.sh

      - name: Check version documentation consistency
        run: scripts/sync-versions.sh check

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: >-
          yamllint
          -d "{extends: relaxed, rules: {line-length: {max: 200}}}"
          .github/workflows/*.yml
          .pre-commit-config.yaml
          docker-compose.yaml

  tfplugindocs-validate:
    name: Docs/Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Install tfplugindocs
        run: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.21.0

      - name: Validate docs against provider schema
        run: tfplugindocs validate --provider-name threexui

      - name: Check hand-written schema sections
        run: >-
          go test ./provider
          -run 'TestDocumentedSchemaSections|TestInboundProtocolDescriptionListsVersionedProtocols'
          -count=1
