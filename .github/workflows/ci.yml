name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test ./provider -run '^Test[^A]' -count=1 -v

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Get OpenTofu path
        id: tofu
        run: echo "path=$(which tofu)" >> "$GITHUB_OUTPUT"

      - name: Start 3x-ui
        run: docker compose up -d --wait

      - name: Wait for 3x-ui to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:2053/ | grep -qE '(200|302|404)'; then
              echo "3x-ui is ready"
              exit 0
            fi
            echo "Waiting for 3x-ui... ($i/30)"
            sleep 2
          done
          echo "3x-ui failed to start"
          docker compose logs
          exit 1

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_PATH: ${{ steps.tofu.outputs.path }}
          TF_ACC_PROVIDER_NAMESPACE: batonogov
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
          THREEXUI_ENDPOINT: http://localhost:2053
          THREEXUI_USERNAME: admin
          THREEXUI_PASSWORD: admin
        run: go test ./provider -run '^TestAcc' -count=1 -timeout 10m -v

      - name: Stop 3x-ui
        if: always()
        run: docker compose down
