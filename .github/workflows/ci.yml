name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3

      - run: task fmt
      - run: task vet
      - run: task lint
      - run: task build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Run unit tests
        run: task test:unit

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Run acceptance tests
        run: task test:acc

  acceptance-matrix:
    name: Compat (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        version: ["v2.8.9", "v2.8.11", "v2.9.0", "v2.9.3"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Run compatibility tests
        env:
          THREEXUI_VERSION: ${{ matrix.version }}
        run: task test:acc:compat
