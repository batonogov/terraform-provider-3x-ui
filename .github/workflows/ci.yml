name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md

# Cancel superseded runs on the same PR/branch — avoids wasting minutes
# and burning the GHCR pull quota on stale commits when force-pushing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Required for docker/login-action to authenticate against ghcr.io with
  # GITHUB_TOKEN — anonymous ghcr pulls share a low rate limit per runner
  # IP and were the root cause of intermittent "API rate limit exceeded"
  # failures on the compat matrix.
  packages: read

# Every `arduino/setup-task` step below passes `repo-token: ${{
# secrets.GITHUB_TOKEN }}`. Authenticated requests get a much higher
# GitHub API rate limit; without the token, setup-task fetches release
# metadata anonymously and shares a low per-IP quota with every other
# Actions runner — observed as "API rate limit exceeded" failures on
# the compat matrix (issue #161).

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3

      - run: task fmt
      - run: task vet
      - run: task lint
      - run: task build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Run unit tests with coverage
        run: go test ./provider -skip '^TestAcc' -count=1 -coverprofile=coverage.out -covermode=atomic -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [lint]
    # Must cover (timeout_minutes × max_attempts) of the retry wrapper
    # below, plus a few minutes of setup. Otherwise the job-level cap
    # kills the second attempt mid-flight.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-job retry catches the residual flake rate after the in-process
      # retry/poll budgets are exhausted (issue #161): GHCR pull jitter,
      # one-off SQLite contention spikes, transient xray-subsystem startup
      # races. A green retry should produce *no* difference in code behavior;
      # if it does, that is a real bug and the diff between attempts will
      # show it. max_attempts=2 is the cheap-insurance setting.
      - name: Run acceptance tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 18
          max_attempts: 2
          retry_on: error
          command: task test:acc

  acceptance-matrix:
    name: Compat (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [lint]
    # Must cover (timeout_minutes × max_attempts) of the retry wrapper
    # below, plus a few minutes of setup. Otherwise the job-level cap
    # kills the second attempt mid-flight.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ["v2.9.0", "v2.9.1", "v2.9.2", "v2.9.3", "v2.9.4", "v3.0.0", "v3.0.1", "v3.0.2"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run compatibility tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          THREEXUI_VERSION: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 18
          max_attempts: 2
          retry_on: error
          command: task test:acc:compat
