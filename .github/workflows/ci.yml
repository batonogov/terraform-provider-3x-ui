name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md

# Cancel superseded runs on the same PR/branch — avoids wasting minutes
# and burning the GHCR pull quota on stale commits when force-pushing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Required for docker/login-action to authenticate against ghcr.io with
  # GITHUB_TOKEN — anonymous ghcr pulls share a low rate limit per runner
  # IP and were the root cause of intermittent "API rate limit exceeded"
  # failures on the compat matrix.
  packages: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3

      - run: task fmt
      - run: task vet
      - run: task lint
      - run: task build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Run unit tests
        run: task test:unit

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run acceptance tests
        run: task test:acc

  acceptance-matrix:
    name: Compat (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["v2.8.9", "v2.8.10", "v2.8.11", "v2.9.0", "v2.9.1", "v2.9.2", "v2.9.3"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run compatibility tests
        env:
          THREEXUI_VERSION: ${{ matrix.version }}
        run: task test:acc:compat
