name: Flake Rate Tracking

on:
  schedule:
    - cron: '3 9 * * 1'  # Monday 9:03 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  prepare-matrix:
    name: Prepare compat matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: set
        run: |
          MATRIX=$(jq -c '[.versions[] | select(.supported == true) | .version]' compat-versions.json)
          VERSIONS=$(jq -r '[.versions[] | select(.supported == true) | .version] | join(" ")' compat-versions.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  compat:
    name: Compat (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Source of truth: compat-versions.json (via prepare-matrix job)
        version: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run compatibility tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          THREEXUI_VERSION: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 18
          max_attempts: 2
          retry_on: error
          command: task test:acc:compat

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [prepare-matrix, compat]
    if: always()
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ needs.prepare-matrix.outputs.versions }}
        run: |
          WEEK=$(date -u +%Y-%m-%d)
          # Collect results from the matrix jobs
          RESULTS=""
          for v in $VERSIONS; do
            JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq ".jobs[] | select(.name == \"Compat ($v)\") | .id")
            if [ -n "$JOB_ID" ]; then
              CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID" --jq '.conclusion')
              RESULTS="$RESULTS\n| $v | ${CONCLUSION:-unknown} |"
            else
              RESULTS="$RESULTS\n| $v | not_found |"
            fi
          done
          BODY="## CI Flake Rate Report — Week of $WEEK\n\n| Version | Result |\n| --- | --- |\n$RESULTS\n\n_Triggered by scheduled workflow._"
          echo -e "$BODY" > report.md
          gh issue create --title "CI Flake Rate Report — Week of $WEEK" --body-file report.md --label "ci" || true
