name: Flake Rate Tracking

on:
  schedule:
    - cron: '3 9 * * 1'  # Monday 9:03 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compat:
    name: Compat (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ["v2.9.0", "v2.9.1", "v2.9.2", "v2.9.3", "v2.9.4", "v3.0.0", "v3.0.1", "v3.0.2"]
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run compatibility tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          THREEXUI_VERSION: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 18
          max_attempts: 2
          retry_on: error
          command: task test:acc:compat

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [compat]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Generate report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +%Y-%m-%d)
          # Collect results from the matrix jobs
          RESULTS=""
          for v in v2.9.0 v2.9.1 v2.9.2 v2.9.3 v2.9.4 v3.0.0 v3.0.1 v3.0.2; do
            JOB_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq ".jobs[] | select(.name == \"Compat ($v)\") | .id")
            if [ -n "$JOB_ID" ]; then
              CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID" --jq '.conclusion')
              RESULTS="$RESULTS\n| $v | ${CONCLUSION:-unknown} |"
            else
              RESULTS="$RESULTS\n| $v | not_found |"
            fi
          done
          BODY="## CI Flake Rate Report — Week of $WEEK\n\n| Version | Result |\n| --- | --- |\n$RESULTS\n\n_Triggered by scheduled workflow._"
          echo -e "$BODY" > report.md
          gh issue create --title "CI Flake Rate Report — Week of $WEEK" --body-file report.md --label "ci" || true
